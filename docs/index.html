<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub activity · Fildza</title>
<style>
:root { color-scheme: light dark; font: 16px system-ui,sans-serif; background: #fff; color: #24292f; }
@media (prefers-color-scheme: dark) { :root { background: #0d1117; color: #e6edf3; } }
* { box-sizing: border-box; }
body { margin: 0; }
main { height: 215vh; }
section { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid; align-content: center; width: min(100%, 950px); padding: 16px; margin: auto; }
iframe { display: block; border: 0; width: 100%; aspect-ratio: 850 / 360; pointer-events: none; }
p { margin: 12px 0; font-size: .9rem; }
a { color: inherit; }
@media (prefers-reduced-motion: reduce) { main { height: auto; } }
</style>
<main><section>
<iframe title="Fildza’s contribution calendar" sandbox="allow-same-origin" tabindex="-1"></iframe>
<p id="hint" role="status">Loading contribution calendar…</p>
<a href="https://github.com/fildzaluthfan#github-activity">Back to GitHub profile</a>
</section></main>
<script type="module">
const frame = document.querySelector('iframe');
const hint = document.querySelector('#hint');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let animations = [];
let duration = 0;
let pending = false;

function draw() {
  pending = false;
  const distance = document.documentElement.scrollHeight - innerHeight;
  const progress = distance > 0 ? Math.min(1, Math.max(0, scrollY / distance)) : 0;
  for (const animation of animations) animation.currentTime = progress * duration;
}
function schedule() {
  if (!pending) {
    pending = true;
    requestAnimationFrame(draw);
  }
}
function connect() {
  animations = frame.contentDocument.getAnimations();
  duration = Math.max(0, ...animations.map(a => a.effect.getComputedTiming().endTime));
  for (const animation of animations) animation.pause();
  draw();
  hint.textContent = reduced.matches ? 'Reduced motion is enabled.' : 'Scroll down to raise the skyline. Scroll up to flatten it.';
}

try {
  const response = await fetch('https://raw.githubusercontent.com/fildzaluthfan/fildzaluthfan/main/assets/contribution-skyline.svg');
  if (!response.ok) throw new Error('Calendar unavailable');
  const url = URL.createObjectURL(new Blob([await response.text()], {type:'image/svg+xml'}));
  frame.addEventListener('load', () => {
    const svg = frame.contentDocument.documentElement;
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    connect();
    reduced.addEventListener('change', () => requestAnimationFrame(connect));
  }, {once:true});
  frame.src = url;
  addEventListener('scroll', schedule, {passive:true});
  addEventListener('resize', schedule);
} catch {
  hint.textContent = 'The calendar could not load. Reload the page to try again.';
}
</script>
</html>
