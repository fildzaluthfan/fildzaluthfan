name: Update GitHub pulse
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: github-pulse
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Generate the GitHub totals card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&show_icons=false&theme=transparent&custom_title=GitHub%20Pulse
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use public statistics if the stats card reports an error
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ github.repository_owner }}
        run: |
          if grep -q 'data-testid="message"' dist/github-stats.svg; then
            python3 scripts/public_stats.py "$PROFILE"
          fi
          grep -q 'GitHub Pulse' dist/github-stats.svg

      - name: Publish generated profile assets
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
