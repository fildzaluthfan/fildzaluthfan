name: Refresh contribution calendar
on:
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: profile-calendar
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render calendar
        env:
          PROFILE: ${{ github.repository_owner }}
        shell: bash
        run: |
          today=$(TZ=Asia/Jakarta date +%F)
          curl --fail --silent --show-error --location --retry 3 "https://github.com/users/$PROFILE/contributions?from=${today:0:4}-01-01&to=$today" | python3 scripts/calendar.py
      - name: Save updated image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-calendar.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution calendar'
            git push
          fi
